events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Must match MAX_UPLOAD_MB in file-service, or Nginx rejects big uploads first (413)
    client_max_body_size 50m;

    # Docker's internal DNS resolves these service names
    upstream auth_service { server auth-service:4001; }
    upstream file_service { server file-service:4002; }

    server {
        listen 80;

        location /api/auth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/files {
            proxy_pass http://file_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Stream uploads straight through instead of buffering them on disk first
            proxy_request_buffering off;
        }

        location / {
            root      /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}
